# Compila los siete binarios, los cuelga de la release y publica en npm.
#
# Corre en Linux y no en Windows a propósito: cross-compilar DESDE Windows falla
# al extraer el runtime de Bun de otras plataformas ("Failed to extract
# executable for bun-linux-x64"). Desde Linux salen los siete.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Las actions van en su major actual, que es el que corre sobre Node 24.
      #
      # Los que estaban —checkout@v4, setup-node@v4, action-gh-release@v2—
      # declaran `using: node20` en su `action.yml`, y GitHub ya los venía
      # forzando a Node 24 con un aviso en cada run. Cuando deje de forzarlos, el
      # release se cae, y se va a caer justo el día que quieras publicar algo.
      #
      # Los breaking changes del camino no tocan nada de acá: el cacheo
      # automático de setup-node v5 se activa sólo si `package.json` declara
      # `packageManager`, y este no lo hace —además acá se instala con Bun, y
      # setup-node está sólo para escribir el .npmrc del registro.
      #
      # `setup-bun` se queda en v2 A PROPÓSITO: su action.yml ya dice node24, y
      # es el único de los cuatro que nunca estuvo en el aviso. Subirlo "por
      # consistencia" sería cambiar lo único que no tiene nada roto.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Lo mismo que exige AGENTS.md antes de decir que algo anda. Si esto falla,
      # no se publica: una release rota es peor que una release tarde.
      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      # Un archivo por plataforma, con el nombre que esperan los instaladores.
      - name: empaquetar
        run: |
          cd dist
          for d in packetsmith-*/; do
            nombre="${d%/}"
            if [ -f "$nombre/bin/packetsmith.exe" ]; then
              (cd "$nombre/bin" && zip -q "../../$nombre.zip" packetsmith.exe)
            else
              tar -czf "$nombre.tar.gz" -C "$nombre/bin" packetsmith
            fi
          done
          ls -la *.tar.gz *.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip

      # npm se publica ACÁ, en el mismo job, y no en uno aparte.
      #
      # Antes había un segundo job que recibía `dist` por artefacto: son ~700 MB
      # entre los siete binarios, y subirlos mató al runner —"the hosted runner
      # lost communication with the server"— DESPUÉS de haber colgado todo en la
      # release. O sea que el run figuraba en rojo con el trabajo hecho.
      #
      # Publicar acá evita el viaje de ida y vuelta entero.
      - uses: actions/setup-node@v7
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: publicar en npm
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Se saltea lo que ya esté publicado en esta versión.
          #
          # npm rechaza republicar una versión existente, así que sin esto un run
          # que muere a mitad —quedó a mano durante una caída de Actions— deja el
          # release imposible de reintentar: el reintento falla en el primer
          # paquete que sí había salido. Publicar es idempotente o no sirve.
          # La carpeta va SIEMPRE con `./` adelante. `dist/packetsmith-darwin-arm64`
          # tiene una barra, así que npm lo lee como el atajo de GitHub
          # `owner/repo` y se va a buscar ssh://git@github.com/dist/… — pasó, y
          # el error habla de claves SSH, que no tiene nada que ver.
          publicar() {
            carpeta="./${1#./}"
            nombre=$(node -p "require('$carpeta/package.json').name")
            version=$(node -p "require('$carpeta/package.json').version")
            if npm view "$nombre@$version" version >/dev/null 2>&1; then
              echo "ya estaba: $nombre@$version"
            else
              echo "publicando: $nombre@$version"
              npm publish "$carpeta" --access public
            fi
          }
          # Los de plataforma PRIMERO: el paquete que los referencia como
          # dependencias opcionales no puede publicarse antes que ellos, o quien
          # instale en ese hueco se queda sin binario.
          for d in dist/packetsmith-*/; do publicar "${d%/}"; done
          publicar dist/packetsmith
